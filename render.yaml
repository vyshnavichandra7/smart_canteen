services:
  - type: web
    name: mgit-smart-canteen
    runtime: static
    buildCommand: git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter" && export PATH="$HOME/flutter/bin:$PATH" && flutter config --enable-web && flutter pub get && flutter build web --release
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
